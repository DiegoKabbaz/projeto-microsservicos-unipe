server.port=8080

spring.application.name=api-gateway


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/



spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true


spring.cloud.gateway.server.webflux.routes[0].id=produto-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUTO-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/produtos/**

spring.cloud.gateway.server.webflux.routes[1].id=pedido-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PEDIDO-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates=Path=/pedidos/**