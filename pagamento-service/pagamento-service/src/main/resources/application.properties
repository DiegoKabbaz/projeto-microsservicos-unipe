spring.application.name=pagamento-service
server.port=8083

# Configuração do Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:pagamentodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Configuração do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update

# Configuração do RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Configuração da fila do RabbitMQ
pagamento.rabbitmq.queue=pagamento-queue
